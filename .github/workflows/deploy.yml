name: Deploy MorinaLens to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check JavaScript syntax
        run: find . -path ./node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

  deploy:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || vars.MORINA_LENS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: morina-lens-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$APP_ENV_FILE"

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Package application
        run: |
          tar --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='.env' \
            -czf "$RUNNER_TEMP/morina-lens.tar.gz" .

      - name: Prepare environment payload
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: printf '%s' "$APP_ENV_FILE" | base64 -w 0 > morina-lens.env.b64

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: scp "$RUNNER_TEMP/morina-lens.tar.gz" morina-lens.env.b64 "${VPS_USER}@${VPS_HOST}:/tmp/"

      - name: Activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" "RELEASE_ID='$RELEASE_ID' bash -s" <<'DEPLOY'
          set -euo pipefail

          app_root=/opt/morina-lens
          release_dir="$app_root/releases/$RELEASE_ID"
          mkdir -p "$release_dir" "$app_root/shared"
          tar -xzf /tmp/morina-lens.tar.gz -C "$release_dir"
          base64 -d /tmp/morina-lens.env.b64 > "$app_root/shared/.env"
          chmod 600 "$app_root/shared/.env"
          ln -sfn "$app_root/shared/.env" "$release_dir/.env"

          cd "$release_dir"
          npm ci --omit=dev
          node - <<'CHECK'
          require('dotenv').config();
          const uri = new URL(process.env.MONGODB_URI || 'mongodb://invalid/invalid');
          if (!['mongodb:', 'mongodb+srv:'].includes(uri.protocol) || uri.pathname !== '/morina-lens') throw new Error('MONGODB_URI phải trỏ tới morina-lens.');
          if (Number(process.env.PORT) !== 3100) throw new Error('PORT phải là 3100.');
          if (!process.env.JWT_SECRET || process.env.JWT_SECRET.length < 32) throw new Error('JWT_SECRET chưa hợp lệ.');
          if (!process.env.ADMIN_USERNAME || !process.env.ADMIN_PASSWORD) throw new Error('Thiếu tài khoản admin ban đầu.');
          CHECK
          npm run seed

          pm2 delete morina-lens || true
          for attempt in $(seq 1 10); do
            if ! ss -ltn 'sport = :3100' | grep -q ':3100'; then break; fi
            sleep 1
          done
          if ss -ltn 'sport = :3100' | grep -q ':3100'; then
            echo 'Cổng 3100 vẫn đang có tiến trình khác sử dụng.'
            ss -ltnp 'sport = :3100' || true
            exit 1
          fi

          pm2 start ecosystem.config.js --env production
          pm2 save
          healthy=false
          for attempt in $(seq 1 18); do
            app_pid="$(pm2 pid morina-lens | tr -d '[:space:]')"
            app_cwd=""
            if [ -n "$app_pid" ] && [ -d "/proc/$app_pid" ]; then
              app_cwd="$(readlink -f "/proc/$app_pid/cwd")"
            fi
            if [ "$app_cwd" = "$release_dir" ] && curl --fail --silent http://127.0.0.1:3100/health >/dev/null; then
              healthy=true
              break
            fi
            sleep 5
          done
          if [ "$healthy" != true ]; then
            pm2 status
            pm2 logs morina-lens --lines 100 --nostream
            exit 1
          fi

          ln -sfn "$release_dir" "$app_root/current"
          rm -f /tmp/morina-lens.tar.gz /tmp/morina-lens.env.b64
          DEPLOY
